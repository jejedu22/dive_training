server {
    listen 80;
    root /usr/share/nginx/html;

    # Le service worker et le manifeste ne doivent jamais être mis en cache par le navigateur
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; add_header Content-Type application/manifest+json; try_files $uri =404; }
    # Service worker laissé par le mode développement : on le remplace par un script qui vide
    # les caches, se désinscrit et recharge la page (sinon l'ancienne version resterait affichée).
    location = /dev-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil((async()=>{for(const k of await caches.keys())await caches.delete(k);await self.registration.unregister();for(const c of await self.clients.matchAll({type:'window'}))c.navigate(c.url)})()));";
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location / { try_files $uri /index.html; }
}
