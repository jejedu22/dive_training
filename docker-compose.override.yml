# Dev local : http://dive.localhost (pas de TLS), hot reload Vite
services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports: ["${HTTP_PORT:-80}:80", "${DASHBOARD_PORT:-8080}:8080"]
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes: ["./frontend:/app", "/app/node_modules"]
    labels:
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.routers.front.tls=false
      - traefik.http.routers.front.tls.certresolver=
      - traefik.http.services.front.loadbalancer.server.port=5173
  backend:
    build:
      context: ./backend
      args:
        COMPOSER_FLAGS: ""
    environment:
      APP_ENV: dev
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - jwtkeys:/var/www/html/config/jwt
    labels:
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.tls=false
      - traefik.http.routers.api.tls.certresolver=
