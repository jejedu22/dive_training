# Dev local : http://dive.localhost (pas de TLS), hot reload Vite
services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports: ["80:80", "8080:8080"]
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes: ["./frontend:/app", "/app/node_modules"]
    labels:
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.routers.front.tls=false
      - traefik.http.routers.front.tls.certresolver=
      - traefik.http.services.front.loadbalancer.server.port=5173
  backend:
    environment:
      APP_ENV: dev
    volumes: ["./backend:/var/www/html"]
    labels:
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.tls=false
      - traefik.http.routers.api.tls.certresolver=
