# Traefik n'est PAS inclus : on se branche sur votre Traefik existant via un réseau Docker externe.
# Réglages (réseau, entrypoint, resolver) : voir .env.
services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-web}
      traefik.http.routers.dive-front.rule: Host(`${DOMAIN}`)
      traefik.http.routers.dive-front.priority: "1"
      traefik.http.routers.dive-front.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dive-front.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      traefik.http.services.dive-front.loadbalancer.server.port: "80"
    networks: [traefik]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    volumes: [jwtkeys:/var/www/html/config/jwt]
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-web}
      traefik.http.routers.dive-api.rule: Host(`${DOMAIN}`) && PathPrefix(`/api`)
      traefik.http.routers.dive-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dive-api.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      # Doit être PLUS prioritaire que le routeur du front (même Host) : sinon /api part vers le front.
      traefik.http.routers.dive-api.priority: "100"
      traefik.http.services.dive-api.loadbalancer.server.port: "80"
    networks: [traefik, internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

volumes:
  dbdata:
  jwtkeys:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
  internal:
    internal: true
