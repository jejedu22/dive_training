# Mode DÉVELOPPEMENT (hot reload Vite, Symfony en dev). Pas utilisé par défaut.
# Lancement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Dev : hot reload. Pour un domaine local sans HTTPS, mettez dans .env :
#   TRAEFIK_ENTRYPOINT=web   (entrypoint HTTP de votre Traefik)
#   CERT_RESOLVER=           (vide : pas de certificat)
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      DOMAIN: ${DOMAIN}
      # filet de sécurité : si une requête /api arrive quand même au serveur Vite, il la relaie au backend
      API_PROXY: http://backend:80
    # Le volume node_modules survit aux reconstructions de l'image : on resynchronise les
    # dépendances à chaque démarrage (sinon un paquet ajouté à package.json manque et Vite plante).
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"
    volumes: ["./frontend:/app", "/app/node_modules"]
    labels:
      traefik.http.services.dive-front.loadbalancer.server.port: "5173"
  backend:
    build:
      context: ./backend
      args:
        COMPOSER_FLAGS: ""
    environment:
      APP_ENV: dev
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - jwtkeys:/var/www/html/config/jwt
